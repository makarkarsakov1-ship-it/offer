services:
  - type: web
    name: nft-business-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7323296973"
      - key: DATABASE_PATH
        value: /tmp/bot.sqlite3
      - key: TRANSFER_FEE_TEXT
        value: "Telegram может запросить дополнительную комиссию в размере 25 Stars. Проверьте актуальную сумму перед подтверждением передачи."
